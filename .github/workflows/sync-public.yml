# oss-dev/public/ を公開リポジトリ `oss` へPRとして同期する。
# 事前に `oss` へ push / PR 作成できる `PUBLIC_SYNC_TOKEN` を設定すること。
name: Sync public → oss

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-public.yml"
  workflow_dispatch:

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREFIX: public
  PUBLIC_REPO: stranger-johnny/oss
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oss-dev (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Split public/ subtree
        id: split
        run: |
          BRANCH="sync/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git subtree split --prefix="$PREFIX" -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push to public repo
        env:
          TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          BRANCH: ${{ steps.split.outputs.branch }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PUBLIC_SYNC_TOKEN secret is not set."
            exit 1
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" \
            "${BRANCH}:${BRANCH}"

      - name: Open Pull Request on public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
          BRANCH: ${{ steps.split.outputs.branch }}
          ACTOR: ${{ github.actor }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          \`oss-dev/${PREFIX}\` から \`git subtree split\` で自動同期しました。

          - 実行者: @${ACTOR}
          - 元コミット: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          > このPR自体は自動化用トークンによって作成されていますが、
          > コミットの author は実際の開発者の情報を保持しています。
          EOF

          PR_URL="$(gh pr create \
            --repo "$PUBLIC_REPO" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "oss-dev から公開コードを同期 ($BRANCH)" \
            --body-file /tmp/pr-body.md)"
          echo "Created PR: $PR_URL"

          gh pr edit "$PR_URL" --add-assignee "$ACTOR" \
            || echo "::warning::@${ACTOR} をPRにアサインできませんでした。"
