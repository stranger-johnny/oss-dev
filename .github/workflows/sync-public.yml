# oss-dev/public/ を公開リポジトリ `oss` へ同期する。
#
# public/ の中身をスナップショット（1コミット）として oss/main を親にした
# sync ブランチに push する。PR作成だけは作成者を実開発者にするため本人が行う。
name: Sync public → oss

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-public.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "公開PRのタイトル（未入力ならソースコミットの件名を使う）"
        required: false
        type: string

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREFIX: public
  PUBLIC_REPO: stranger-johnny/oss
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oss-dev
        uses: actions/checkout@v4

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.OSS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::OSS_DEPLOY_KEY secret is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/oss_deploy
          chmod 600 ~/.ssh/oss_deploy
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/oss_deploy
            IdentitiesOnly yes
          EOF

      - name: Publish public/ to a sync branch
        id: sync
        env:
          TITLE_INPUT: ${{ inputs.title }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git remote add public "git@github.com:${PUBLIC_REPO}.git"
          git fetch public "$BASE_BRANCH"
          BRANCH="sync/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          # コミットメッセージ＝PRタイトル（単一コミットならGitHubが初期値に使う）。
          MESSAGE="${TITLE_INPUT:-$(git log -1 --format=%s HEAD)}"
          # public/ の tree を、oss/main を親にした1コミットにして push する。
          TREE="$(git rev-parse "HEAD:${PREFIX}")"
          COMMIT="$(git commit-tree "$TREE" -p "public/${BASE_BRANCH}" -m "$MESSAGE")"
          git push public "${COMMIT}:refs/heads/${BRANCH}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Emit "Create PR" link
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          COMPARE_URL="${GITHUB_SERVER_URL}/${PUBLIC_REPO}/compare/${BASE_BRANCH}...${BRANCH}?expand=1"
          {
            echo "### 公開PRを作成してください"
            echo ""
            echo "同期ブランチ \`${BRANCH}\` を \`${PUBLIC_REPO}\` に push しました。"
            echo "次のリンクからPRを作成すると、作成者はあなた自身になります。"
            echo ""
            echo "[Compare & pull request →](${COMPARE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Compare URL: ${COMPARE_URL}"
