# oss-dev/public/ を公開リポジトリ `oss` へ同期する。
#
# public/ の中身をスナップショット（1コミット）として oss/main を親にした
# sync ブランチに push する。PR作成だけは作成者を実開発者にするため本人が行う。
name: Sync public → oss

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-public.yml"

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREFIX: public
  PUBLIC_REPO: stranger-johnny/oss
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oss-dev
        uses: actions/checkout@v4

      - name: Prepare SSH access to oss and publish a sync branch
        env:
          DEPLOY_KEY: ${{ secrets.OSS_DEPLOY_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # deploy key はあらかじめ作成し、公開鍵を oss の Deploy keys に、
          # 秘密鍵を oss-dev の OSS_DEPLOY_KEY Secret に登録しておく。
          # GitHub Actions の実行環境は毎回使い捨てなので、ここで一時的な
          # ssh-agent に秘密鍵を読み込ませる。これ以降の git fetch / push は
          # SSH が自動的にこの agent の鍵を使うため、GIT_SSH_COMMAND は不要。
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::OSS_DEPLOY_KEY secret is not set."
            exit 1
          fi
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_KEY" | ssh-add -

          # GitHub のホスト鍵を登録し、接続先が本物であることを確認できるようにする。
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -t rsa,ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null

          # 公開リポジトリの main を取得する。
          # 後で作る同期コミットの親にするため、oss 側の履歴が通常のPRとしてつながる。
          git remote add public "git@github.com:${PUBLIC_REPO}.git"
          public_base_ref="refs/remotes/public/${BASE_BRANCH}"
          git fetch public "${BASE_BRANCH}:${public_base_ref}"

          # oss-dev/public/ の中身だけを1つのスナップショットコミットにする。
          # oss-dev 側の非公開履歴や internal/ は公開されない。
          public_tree="$(git rev-parse "HEAD:${PREFIX}")"
          sync_commit="$(git commit-tree "$public_tree" \
            -p "$public_base_ref" \
            -m "chore: sync public from oss-dev")"

          # スナップショットコミットを oss の sync/* ブランチとして push する。
          # PR作成とレビューは、この後に本人が GitHub 上で行う。
          sync_branch="sync/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git push public "${sync_commit}:refs/heads/${sync_branch}"
          echo "Pushed ${sync_branch} to ${PUBLIC_REPO}."
