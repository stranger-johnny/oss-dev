# oss-dev/public/ を公開リポジトリ `oss` へ同期する。
#
# subtree split とブランチ push までを自動化し、最後のPR作成だけ本人が
# ワンクリックで行う（PRの作成者を実際の開発者にするため）。
# push には `oss` に登録したデプロイキー（Secret: OSS_DEPLOY_KEY）を使う。
name: Sync public → oss

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/sync-public.yml"
  workflow_dispatch:

concurrency:
  group: sync-public
  cancel-in-progress: false

permissions:
  contents: read

env:
  PREFIX: public
  PUBLIC_REPO: stranger-johnny/oss
  BASE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oss-dev (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.OSS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::OSS_DEPLOY_KEY secret is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/oss_deploy
          chmod 600 ~/.ssh/oss_deploy
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            IdentityFile ~/.ssh/oss_deploy
            IdentitiesOnly yes
          EOF

      - name: Split public/ subtree
        id: split
        run: |
          BRANCH="sync/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git subtree split --prefix="$PREFIX" -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push to public repo
        env:
          BRANCH: ${{ steps.split.outputs.branch }}
        run: |
          git push "git@github.com:${PUBLIC_REPO}.git" "${BRANCH}:${BRANCH}"

      - name: Emit "Create PR" link
        env:
          BRANCH: ${{ steps.split.outputs.branch }}
        run: |
          # 本人のアカウントでPRを作成できるよう、フォーム展開済みの Compare
          # リンクをジョブサマリに出力する（このリンクから作ると作成者=本人）。
          COMPARE_URL="${GITHUB_SERVER_URL}/${PUBLIC_REPO}/compare/${BASE_BRANCH}...${BRANCH}?expand=1"
          {
            echo "### 公開PRを作成してください"
            echo ""
            echo "同期ブランチ \`${BRANCH}\` を \`${PUBLIC_REPO}\` に push しました。"
            echo "次のリンクからPRを作成すると、作成者はあなた自身になります。"
            echo ""
            echo "[Compare & pull request →](${COMPARE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Compare URL: ${COMPARE_URL}"
